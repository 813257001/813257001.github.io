
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1877f2">
    <title>Thoughtly</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
    <div class="brand">Thoughtly</div>
    <div class="tagline">Share thoughts. Inspire people.</div>
</header>

<main class="container">

    <section class="welcome">
        <h1>Your daily dose of inspiration.</h1>
        <p>Share quotes, thoughts, and ideas with the world.</p>
    </section>

    <section class="composer">
        <div class="composer-heading">
            <div class="avatar">M</div>
            <h2>Create a post</h2>
        </div>

        <form id="postForm">
            <input
                type="text"
                id="postTitle"
                placeholder="Give your post a title..."
                maxlength="120"
                required
            >

            <textarea
                id="postText"
                placeholder="What's on your mind?"
                maxlength="2000"
                required
            ></textarea>

            <label class="upload-label" for="postImage">
                📷 Add an image (optional)
            </label>

            <input
                type="file"
                id="postImage"
                accept="image/*"
            >

            <div id="imagePreview"></div>

            <button type="submit" class="publish-btn">
                Publish post
            </button>
        </form>
    </section>

    <div class="feed-heading">
        <h2>Community feed</h2>
        <span id="postCount">0 posts</span>
    </div>

    <section id="feed" aria-live="polite"></section>

</main>

<footer>
 Mohtad Abdullah Qutab 2026
</footer>

<script src="script.js"></script>
</body>
</html>
