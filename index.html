
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101018">
  <title>Thoughtly — Share your thoughts</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="#">thoughtly<span>.</span></a>
    <span class="tagline">A place for your thoughts.</span>
    <button id="logoutBtn" class="secondary hidden">Log out</button>
  </header>

  <main>
    <section id="authSection" class="auth-card">
      <h1>Welcome to Thoughtly.</h1>
      <p class="muted">A little space for a lot of thoughts.</p>

      <div class="tabs">
        <button id="loginTab" class="tab active">Log in</button>
        <button id="signupTab" class="tab">Sign up</button>
      </div>

      <form id="authForm">
        <div id="usernameField" class="hidden">
          <label for="username">Username</label>
          <input id="username" type="text"
            placeholder="Choose a username"
            minlength="3" maxlength="24"
            pattern="[A-Za-z0-9_]+"
            autocomplete="username">
        </div>

        <label for="email">Email</label>
        <input id="email" type="email"
          placeholder="you@example.com"
          autocomplete="email" required>

        <label for="password">Password</label>
        <input id="password" type="password"
          placeholder="Your password"
          minlength="6"
          autocomplete="current-password" required>

        <button id="authSubmit" class="primary full" type="submit">
          Log in
        </button>
      </form>

      <p id="authMessage" class="message" role="status"></p>
    </section>

    <section id="appSection" class="hidden">
      <div class="welcome">
        <div>
          <p class="muted">YOUR COMMUNITY</p>
          <h1>What's on your mind?</h1>
        </div>
        <div class="user-pill">
          <span class="avatar">✦</span>
          <span id="currentUsername"></span>
        </div>
      </div>

      <section class="composer">
        <h2>Share a thought</h2>
        <form id="postForm">
          <textarea id="postContent"
            placeholder="Write something worth sharing..."
            maxlength="1000" required></textarea>
          <div class="composer-bottom">
            <span class="muted">Up to 1,000 characters</span>
            <button class="primary" type="submit">Publish thought</button>
          </div>
        </form>
        <p id="postMessage" class="message" role="status"></p>
      </section>

      <section class="feed">
        <div class="feed-heading">
          <h2>Community feed</h2>
          <button id="refreshBtn" class="secondary">Refresh</button>
        </div>
        <div id="posts">
          <p class="muted">Loading thoughts...</p>
        </div>
      </section>
    </section>
  </main>

  <footer>
    <a class="logo" href="#">thoughtly<span>.</span></a>
    <p>Made for people with something to say.</p>
  </footer>

  <script type="module" src="script.js"></script>
</body>
</html>
